name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Nothing in CI writes, so the token gets read access and nothing else.
permissions:
  contents: read

# Only the newest commit on a PR is worth testing. Without this, pushing twice
# in quick succession runs the full six-job matrix to completion both times when
# only the last result is ever looked at.
#
# main is excluded from cancellation via the run_id fallback: its runs each
# correspond to a distinct merged commit, so every one gets a real pass/fail
# rather than being cancelled by the next merge.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # Lint, formatting and type results are platform-independent, so these run
  # once on Linux rather than three times across the test matrix.
  #
  # Deliberately no `npm run rebuild` and no Python setup: nothing here loads
  # better-sqlite3 or node-pty, so this job skips the slowest part of the test
  # job's setup and finishes long before the matrix does.
  quality:
    name: Lint, Format & Types
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # --ignore-scripts skips the postinstall electron-builder rebuild, which
      # exists to compile native modules this job never touches.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run linter
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      # Covers all three tsconfig projects. The frontend one uses vue-tsc,
      # which is the only checker that reads .vue single-file components --
      # plain tsc skips them silently, and Vite transpiles without type
      # checking, so a type regression inside a component is invisible to
      # every other job in this workflow.
      - name: Run type checking
        run: npm run type-check

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Python (for native module builds)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules for Electron
        run: npm run rebuild
        env:
          PYTHON: python3

      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        env:
          NODE_ENV: test
        run: xvfb-run --auto-servernum npm test -- --run

      - name: Run tests (macOS/Windows)
        if: runner.os != 'Linux'
        env:
          NODE_ENV: test
        run: npm test -- --run

      - name: Build project
        run: npm run build

  build-distributables:
    name: Build App (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: test

    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-2022, ubuntu-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Python (for native module builds)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Rebuild native modules for Electron
        run: npm run rebuild
        env:
          PYTHON: python3

      - name: Prune dev dependencies
        run: npm prune --omit=dev

      - name: Create placeholder for missing libsql platform packages
        shell: bash
        run: |
          mkdir -p node_modules/@libsql/darwin-x64
          echo '{"name":"@libsql/darwin-x64","version":"0.0.0"}' > node_modules/@libsql/darwin-x64/package.json
          mkdir -p node_modules/@libsql/linux-x64-gnu
          echo '{"name":"@libsql/linux-x64-gnu","version":"0.0.0"}' > node_modules/@libsql/linux-x64-gnu/package.json

      - name: Build distributable (macOS)
        if: runner.os == 'macOS'
        run: npx --yes electron-builder --mac --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Build distributable (Windows)
        if: runner.os == 'Windows'
        run: npx --yes electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Build distributable (Linux)
        if: runner.os == 'Linux'
        run: npx --yes electron-builder --linux --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-build
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
          if-no-files-found: ignore
          retention-days: 7
