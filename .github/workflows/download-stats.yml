name: Download Stats

on:
  schedule:
    # 09:00 UTC daily. GitHub's asset counters are lifetime cumulative totals
    # with no time dimension of their own, so the only way to get a trend is to
    # snapshot them on a fixed cadence and diff consecutive rows.
    - cron: '0 9 * * *'
  workflow_dispatch:

# Writes to the download-stats branch only; never touches main.
permissions:
  contents: write

# A scheduled run and a manual run landing together would race on the same
# branch tip and one would fail to push. Queue them instead of cancelling, so
# no snapshot is silently dropped.
concurrency:
  group: download-stats
  cancel-in-progress: false

jobs:
  snapshot:
    name: Snapshot release asset download counts
    runs-on: ubuntu-latest

    steps:
      # Only the orphan data branch is checked out — none of the application
      # source is needed, and fetch-depth 0 keeps the full CSV history so the
      # delta step can read yesterday's row.
      - name: Check out the stats branch
        uses: actions/checkout@v4
        with:
          ref: download-stats
          fetch-depth: 0
          # Tolerate the branch not existing yet on the very first run; the
          # bootstrap step below creates it.
          continue-on-error: true
        id: checkout
        continue-on-error: true

      - name: Bootstrap the stats branch on first run
        if: steps.checkout.outcome == 'failure'
        run: |
          # An orphan branch shares no history with main, so these commits never
          # appear in main's log and never conflict with a feature branch.
          git init -b download-stats .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          printf 'date,tag,asset,count\n' > downloads.csv

      - name: Fetch current download counts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TODAY="$(date -u +%F)"

          # The asset name alone is not unique: latest-mac.yml, latest.yml and
          # friends repeat in every release. Rows are keyed by tag AND name so
          # consecutive snapshots can be diffed per asset.
          gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
            --jq '.[] | .tag_name as $t | .assets[]
                  | [$t, .name, .download_count] | @csv' \
            | sed "s/^/\"${TODAY}\",/" > today.csv

          if [ ! -s today.csv ]; then
            echo "::error::No release assets returned; refusing to write an empty snapshot."
            exit 1
          fi

          echo "Fetched $(wc -l < today.csv) asset rows."

      - name: Append snapshot and render summary
        run: |
          set -euo pipefail
          TODAY="$(date -u +%F)"

          # Guard against a re-run on the same day writing the date twice.
          if cut -d, -f1 downloads.csv | grep -qx "\"${TODAY}\""; then
            echo "A snapshot for ${TODAY} already exists; replacing it."
            grep -v "^\"${TODAY}\"," downloads.csv > trimmed.csv
            mv trimmed.csv downloads.csv
          fi

          # The previous snapshot date, read before today's rows are appended.
          # On the very first run the file is header-only, so grep matches
          # nothing and exits 1 — which pipefail would turn into a dead step.
          # `|| true` keeps an empty PREV meaning "no prior data" instead.
          PREV="$( { cut -d, -f1 downloads.csv | grep -v '^date$' || true; } \
                  | tr -d '"' | sort -u | tail -1)"

          cat today.csv >> downloads.csv

          # Totals are bucketed the same way for both dates so the delta is
          # comparing like with like. Installable binaries are the number that
          # actually means "someone got the app"; .yml manifests are update
          # polls from already-installed copies and blockmaps are delta-update
          # chunks, so both are counted separately rather than folded in.
          bucket() {
            awk -F',' -v want="$1" '
              { gsub(/"/, "") }
              $1 != want { next }
              {
                name = $3; c = $4 + 0
                total += c
                if (name ~ /\.blockmap$/) { blockmap += c; next }
                if (name ~ /\.yml$/)      { yml += c; next }
                real += c
                if (name ~ /\.dmg$/)           dmg += c
                else if (name ~ /mac\.zip$/)   mzip += c
                else if (name ~ /\.exe$/)      exe += c
                else if (name ~ /\.AppImage$/) appimg += c
                else if (name ~ /\.deb$/)      deb += c
                else if (name ~ /\.rpm$/)      rpm += c
              }
              END {
                printf "%d %d %d %d %d %d %d %d %d\n",
                  real, dmg, mzip, exe, appimg, deb, rpm, yml, blockmap
              }
            ' downloads.csv
          }

          read -r r dmg mzip exe app deb rpm yml bm <<< "$(bucket "$TODAY")"

          if [ -n "$PREV" ] && [ "$PREV" != "$TODAY" ]; then
            read -r pr pdmg pmzip pexe papp pdeb prpm pyml pbm <<< "$(bucket "$PREV")"
          else
            pr=""; 
          fi

          # An em dash for "no change" reads faster than +0 in a column of numbers.
          d() {
            [ -z "$pr" ] && { printf ''; return; }
            local delta=$(( $1 - $2 ))
            if   [ "$delta" -gt 0 ]; then printf ' (+%d)' "$delta"
            elif [ "$delta" -lt 0 ]; then printf ' (%d)' "$delta"
            else printf ' (—)'
            fi
          }

          {
            echo "## Barnacles downloads — ${TODAY}"
            echo
            if [ -n "$pr" ]; then
              echo "Compared against \`${PREV}\`."
            else
              echo "First snapshot — no prior data to compare against."
            fi
            echo
            echo '```'
            printf 'Installable binaries   %4d%s\n'  "$r"    "$(d "$r" "${pr:-0}")"
            printf '  macOS .dmg           %4d%s\n'  "$dmg"  "$(d "$dmg" "${pdmg:-0}")"
            printf '  macOS -mac.zip       %4d%s\n'  "$mzip" "$(d "$mzip" "${pmzip:-0}")"
            printf '  Windows .exe         %4d%s\n'  "$exe"  "$(d "$exe" "${pexe:-0}")"
            printf '  Linux .AppImage      %4d%s\n'  "$app"  "$(d "$app" "${papp:-0}")"
            printf '  Linux .deb           %4d%s\n'  "$deb"  "$(d "$deb" "${pdeb:-0}")"
            printf '  Linux .rpm           %4d%s\n'  "$rpm"  "$(d "$rpm" "${prpm:-0}")"
            echo
            printf 'Update checks (.yml)   %4d%s\n'  "$yml"  "$(d "$yml" "${pyml:-0}")"
            printf 'Blockmaps              %4d%s\n'  "$bm"   "$(d "$bm" "${pbm:-0}")"
            echo '```'
            echo
            echo "_Counters are lifetime cumulative and include bots, retries and CI, so treat them as an upper bound._"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the snapshot
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          rm -f today.csv
          git add downloads.csv
          if git diff --staged --quiet; then
            echo "Counts unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "Record download counts for $(date -u +%F)"
          git push origin download-stats
